services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DATABASE_URL: sqlite:////data/db/app.db
      UPLOAD_DIR: /data/uploads
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - app_db:/data/db
      - app_uploads:/data/uploads
      - ./backups:/backups
      - ${STREAMLIT_SECRETS_FILE:-./.streamlit/secrets.toml}:/app/.streamlit/secrets.toml:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  reminder_scheduler:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DATABASE_URL: sqlite:////data/db/app.db
      UPLOAD_DIR: /data/uploads
    entrypoint: ["english-leaderboard", "scheduler"]
    volumes:
      - app_db:/data/db
      - app_uploads:/data/uploads
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_db:
  app_uploads:
