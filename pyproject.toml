[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "english-activity-leaderboard"
version = "0.1.0"
description = "MVP interno para atividades de inglês e leaderboard"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.scripts]
english-leaderboard = "english_leaderboard.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["english_leaderboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "ocr: executa inferência OCR local nos screenshots reais",
]
